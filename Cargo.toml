[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "EUPL-1.2"
repository = "https://github.com/nathsou/synth"
publish = false

[workspace.dependencies]
synth-core = { path = "crates/synth-core" }
arch-xc7 = { path = "crates/arch-xc7" }
arch-ice40 = { path = "crates/arch-ice40" }
synth-dbgen = { path = "crates/synth-dbgen" }
synth-elab = { path = "crates/synth-elab" }
synth-logic = { path = "crates/synth-logic" }
synth-playground = { path = "crates/synth-playground" }
synth-lsp = { path = "crates/synth-lsp" }
synth-netlist = { path = "crates/synth-netlist" }
synth-rtl = { path = "crates/synth-rtl" }
synth-rtlil = { path = "crates/synth-rtlil" }
synth-route = { path = "crates/synth-route" }
synth-sim = { path = "crates/synth-sim" }
synth-verilog = { path = "crates/synth-verilog" }
synth-weft = { path = "crates/synth-weft" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# CI's simulation jobs: optimized, but much faster to build than release.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
debug = false

# Place-and-route tests are far too slow unoptimized.
[profile.test]
opt-level = 2

[profile.dev]
opt-level = 1
