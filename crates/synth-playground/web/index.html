<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>synth playground</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="tb-left">
    <a class="brand" href="https://github.com/nathsou/synth" target="_blank" rel="noopener" title="synth on GitHub"><svg viewBox="0 0 24 24" class="logo" aria-hidden="true"><use href="#i-logo"/></svg><span>synth</span></a>
    <span class="slash" aria-hidden="true">/</span>
    <button id="project" class="ghost project" title="Open an example" aria-haspopup="menu"><span id="project-name">Playground</span><span id="project-dot" class="edited-dot" title="Edited" hidden></span><svg class="chev"><use href="#i-chevron"/></svg></button>
  </div>
  <div class="tb-center">
    <button id="board" class="board-btn" title="Board, device and package" aria-haspopup="dialog">
      <span class="board-ico"><svg><use href="#i-board"/></svg></span>
      <span id="board-name" class="board-name">Board</span>
      <span id="board-meta" class="board-meta mono"></span>
      <svg class="chev"><use href="#i-chevron"/></svg>
    </button>
    <div class="run-split" id="run-split">
      <button id="run" class="run-main" title="Run the whole flow (Ctrl+Enter)"><svg><use href="#i-play"/></svg><span>Run</span><kbd class="run-kbd" id="run-kbd">Ctrl ↵</kbd></button>
      <button id="run-options" class="run-more" title="Run options" aria-label="Run options" aria-haspopup="dialog"><svg><use href="#i-chevron"/></svg></button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </div>
  <div class="tb-right">
    <button id="palette" class="palette-btn" title="Jump to a step, a cell, an example or an action"><svg><use href="#i-search"/></svg><span>Jump to…</span><kbd id="palette-kbd">Ctrl K</kbd></button>
    <button id="share" class="icon-btn" title="Copy a link to this design" aria-label="Copy a link to this design"><svg><use href="#i-link"/></svg></button>
    <button id="download" class="icon-btn" title="Download the bitstream (.bin for iCE40, .bit for Artix-7)" aria-label="Download the bitstream" disabled><svg><use href="#i-download"/></svg></button>
    <button id="program" class="icon-btn" title="Program the board connected over USB (Chrome, Edge and other Chromium-based browsers): the flash of an iCE40 board, or the FPGA of an Artix-7 board" aria-label="Program the board over USB" disabled><svg><use href="#i-usb"/></svg></button>
    <button id="settings" class="icon-btn" title="Settings" aria-label="Settings"><svg><use href="#i-sliders"/></svg></button>
  </div>
  <div id="progress-line" class="progress-line" aria-hidden="true"></div>
</header>

<main id="main" class="main">
  <nav id="files-rail" class="files-rail" aria-label="Files"></nav>
  <section id="left" class="pane left" aria-label="Editor">
    <div class="tabs files" id="file-tabs"></div>
    <div id="editor" class="editor-host"></div>
    <div class="split-h" id="split-bottom" title="Drag to resize"></div>
    <div class="bottom" id="bottom">
      <div class="bottom-bar" id="bottom-bar">
        <div class="tabs" id="bottom-tabs" role="tablist">
          <button data-tab="problems" class="active" role="tab">Problems <span class="badge" id="problem-count"></span></button>
          <button data-tab="log" role="tab">Log</button>
        </div>
        <span id="problem-peek" class="problem-peek mono"></span>
        <button id="bottom-toggle" class="icon-btn sm" title="Show or hide problems and the log" aria-label="Show or hide problems and the log"><svg><use href="#i-chevron"/></svg></button>
      </div>
      <div class="tab-body" id="bottom-body">
        <div data-pane="problems" id="problems" class="list"></div>
        <div data-pane="log" id="log" class="log" hidden></div>
      </div>
    </div>
  </section>
  <div class="split-v" id="split-main" title="Drag to resize"></div>
  <section id="right" class="pane right" aria-label="Flow">
    <nav class="rail" id="rail" aria-label="Steps of the flow">
      <div class="seg mode" id="mode" role="tablist">
        <button data-mode="flow" class="on" role="tab">Flow</button>
        <button data-mode="simulate" role="tab">Simulate</button>
        <button data-mode="reference" role="tab" title="The Weft language: types, statements, builtins and the standard library">Reference</button>
      </div>
      <span class="rail-div" aria-hidden="true"></span>
      <div class="rail-steps" id="rail-steps"></div>
    </nav>
    <div class="views-body">
      <div data-view-pane="pipeline" id="pipeline" class="view scroll"></div>
      <div data-view-pane="schematic" id="schematic" class="view" hidden></div>
      <div data-view-pane="chip" id="chip" class="view" hidden></div>
      <div data-view-pane="timing" id="timing" class="view scroll" hidden></div>
      <div data-view-pane="bitstream" id="bitstream" class="view" hidden></div>
      <div data-view-pane="simulation" id="simulation" class="view scroll" hidden></div>
      <div data-view-pane="reference" id="reference" class="view scroll reference" hidden></div>
      <div id="empty" class="empty-state">
        <svg><use href="#i-logo"/></svg>
        <p>Press <kbd>Run</kbd> to elaborate, synthesise, place, route and write a bitstream.</p>
      </div>
    </div>
  </section>
</main>

<footer class="statusbar" id="statusbar">
  <span class="sb-item" id="sb-mode"><span class="dot"></span><span></span></span>
  <button class="sb-item" id="sb-problems" title="Problems"></button>
  <span class="grow"></span>
  <span class="sb-item mono" id="sb-usage"></span>
  <span class="sb-item mono" id="sb-fmax"></span>
  <span class="sb-item mono" id="sb-cursor"></span>
  <span class="sb-item" id="sb-lang"></span>
</footer>

<div id="tooltip" class="tooltip" hidden></div>
<div id="popover-host"></div>

<script type="module" src="app.js"></script>
</body>
</html>
