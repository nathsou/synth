name: Playground (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['crates/**', 'tools/build_playground.sh', 'tools/fetch_xc7_db.sh', 'Cargo.*', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      # The Artix-7 boards need Project X-Ray's database, bundled per part
      # into the site (about 4 MB each).
      - name: Cache the Artix-7 database
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/prjxray-db
          key: prjxray-db-${{ hashFiles('tools/fetch_xc7_db.sh') }}
      - name: Fetch the Artix-7 database
        run: tools/fetch_xc7_db.sh "$RUNNER_TEMP/prjxray-db"
      - name: Build the playground
        run: XC7_DB="$RUNNER_TEMP/prjxray-db/artix7" tools/build_playground.sh site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
