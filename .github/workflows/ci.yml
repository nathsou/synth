name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
      - name: Check
        run: cargo check --workspace --all-targets

  playground:
    name: playground (WebAssembly and web app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Clippy (wasm32)
        run: cargo clippy -p synth-playground --target wasm32-unknown-unknown
      - name: Build the static site
        run: tools/build_playground.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web app syntax
        run: for f in crates/synth-playground/web/*.js editors/vscode/*.js; do node --check "$f"; done
      - name: Web app unit tests
        run: node --test crates/synth-playground/web/tests/web.test.mjs

  bitsim:
    name: bitstream simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install reference tools (test oracles only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys fpga-icestorm iverilog
      - name: Build
        run: cargo build --release -p synth
      - name: Bitstream-level simulation
        run: tools/ci_bitsim.sh
      - name: Incremental bitstream simulation
        run: tools/ci_incremental.sh

  rtlsim:
    name: frontend differential simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install iverilog and Yosys cell models (test oracles only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog yosys
      - name: Build
        run: cargo build --release -p synth
      - name: Elaborated netlists vs source RTL
        run: tools/ci_rtlsim.sh
      - name: Synthesised netlists vs RTL
        run: MODE=synth tools/ci_rtlsim.sh

  euler:
    name: Project Euler solvers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install iverilog and Yosys cell models (test oracles only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog yosys
      - name: Build
        run: cargo build --release -p synth
      - name: RTL and synthesised netlists give the answers
        run: tools/ci_euler.sh
