name: CI

# Pull requests run the jobs their changes can affect; the
# slow simulation job waits until the PR is ready for review. A push to main
# (after the PR already passed) only runs the fast tests. The weekly run and
# manual runs cover everything and refresh the caches.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE*']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE*']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  # Which parts of the repository the change touches.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      sim: ${{ steps.f.outputs.sim }}
      playground: ${{ steps.f.outputs.playground }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = push ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" != pull_request ]; then
            printf 'rust=true\nsim=true\nplayground=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          any() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          shared='^(Cargo\.(toml|lock)|\.github/workflows/ci\.yml)$'
          echo "rust=$(any "^(crates|tests|examples)/|$shared")" >> "$GITHUB_OUTPUT"
          # The simulations exercise the frontends, synthesis and the backend,
          # not the playground, the language server or the editors.
          echo "sim=$(echo "$files" | grep -E "^(crates|tests|examples|tools)/|$shared" \
            | grep -vE '^crates/synth-(playground|lsp)/|^tools/build_playground\.sh$' | grep -q . && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "playground=$(echo "$files" | grep -E "^(crates|examples|editors)/|^tools/build_playground\.sh$|$shared" \
            | grep -vE '^crates/(synth|synth-lsp)/' | grep -q . && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: target
          key: test-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: test-${{ hashFiles('Cargo.lock') }}-
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  msrv:
    name: MSRV
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
      - uses: actions/cache@v4
        with:
          path: target
          key: msrv-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: msrv-${{ hashFiles('Cargo.lock') }}-
      - name: Check
        run: cargo check --workspace --all-targets

  playground:
    name: playground (WebAssembly and web app)
    needs: changes
    if: needs.changes.outputs.playground == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: target
          key: wasm-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: wasm-${{ hashFiles('Cargo.lock') }}-
      - name: Clippy (wasm32)
        run: cargo clippy -p synth-playground --target wasm32-unknown-unknown
      - name: Build the static site
        run: tools/build_playground.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web app syntax
        run: for f in crates/synth-playground/web/*.js editors/vscode/*.js; do node --check "$f"; done
      - name: Web app unit tests
        run: node --test crates/synth-playground/web/tests/web.test.mjs

  # Bitstream simulation, frontend differential simulation and the Project
  # Euler solvers share one build of synth and one install of the oracles.
  simulation:
    name: simulation (bitstream, frontend, Project Euler)
    needs: changes
    if: needs.changes.outputs.sim == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      SYNTH: ${{ github.workspace }}/target/ci/synth
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: target
          key: sim-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: sim-${{ hashFiles('Cargo.lock') }}-
      - name: Install reference tools (test oracles only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys fpga-icestorm iverilog
      - name: Build
        run: cargo build --profile ci -p synth
      - name: Bitstream-level simulation
        run: tools/ci_bitsim.sh
      - name: Incremental bitstream simulation
        run: tools/ci_incremental.sh
      - name: Elaborated netlists vs source RTL
        run: tools/ci_rtlsim.sh
      - name: Synthesised netlists vs RTL
        run: MODE=synth tools/ci_rtlsim.sh
      - name: RTL and synthesised netlists give the answers
        run: tools/ci_euler.sh
