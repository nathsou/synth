name: CI

# Each run does only what the change needs: tools/ci_changes.py maps the
# changed files to the crates to check and test (with every crate depending
# on them) and to the simulation suites that exercise them. The slow
# simulations wait until a pull request is ready for review. Manual runs do
# everything.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE*']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.f.outputs.packages }}
      frontend: ${{ steps.f.outputs.frontend }}
      pnr: ${{ steps.f.outputs.pnr }}
      playground: ${{ steps.f.outputs.playground }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) git diff --name-only "$PR_BASE"...HEAD | tools/ci_changes.py ;;
            # A merge was already tested as a pull request: on main only the
            # crate tests run, for what the merge changed.
            push) git diff --name-only "$BEFORE" HEAD | tools/ci_changes.py | grep '^packages=' ;;
            *) tools/ci_changes.py --all ;;
          esac | tee -a "$GITHUB_OUTPUT"

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.packages != ''
    runs-on: ubuntu-latest
    env:
      PACKAGES: ${{ needs.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: target
          key: test-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: test-${{ hashFiles('Cargo.lock') }}-
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy $PACKAGES --all-targets
      - name: Test
        run: cargo test $PACKAGES

  msrv:
    name: MSRV
    needs: changes
    if: needs.changes.outputs.packages != '' && github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      PACKAGES: ${{ needs.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
      - uses: actions/cache@v4
        with:
          path: target
          key: msrv-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: msrv-${{ hashFiles('Cargo.lock') }}-
      - name: Check
        run: cargo check $PACKAGES --all-targets

  playground:
    name: playground (WebAssembly and web app)
    needs: changes
    if: needs.changes.outputs.playground == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: target
          key: wasm-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: wasm-${{ hashFiles('Cargo.lock') }}-
      - name: Clippy (wasm32)
        run: cargo clippy -p synth-playground --target wasm32-unknown-unknown
      - name: Build the static site
        run: tools/build_playground.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web app syntax
        run: for f in crates/synth-playground/web/*.js editors/vscode/*.js; do node --check "$f"; done
      - name: Web app unit tests
        run: node --test crates/synth-playground/web/tests/web.test.mjs

  # The simulation suites share one build of synth and one install of the
  # oracles; each runs only when the change can affect it.
  simulation:
    name: simulation
    needs: changes
    if: (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.pnr == 'true') && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      SYNTH: ${{ github.workspace }}/target/ci/synth
      FRONTEND: ${{ needs.changes.outputs.frontend }}
      PNR: ${{ needs.changes.outputs.pnr }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: target
          key: sim-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: sim-${{ hashFiles('Cargo.lock') }}-
      - name: Install reference tools (test oracles only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys iverilog $([ "$PNR" = true ] && echo fpga-icestorm)
      - name: Build
        run: cargo build --profile ci -p synth
      - name: In-process simulation (synth sim)
        run: tools/ci_sim.sh
      - name: Bitstream-level simulation
        if: env.PNR == 'true'
        run: tools/ci_bitsim.sh
      - name: Incremental bitstream simulation
        if: env.PNR == 'true'
        run: tools/ci_incremental.sh
      - name: Elaborated netlists vs source RTL
        if: env.FRONTEND == 'true'
        run: tools/ci_rtlsim.sh
      - name: Synthesised netlists vs RTL
        if: env.FRONTEND == 'true'
        run: MODE=synth tools/ci_rtlsim.sh
      - name: RTL and synthesised netlists give the answers
        if: env.FRONTEND == 'true'
        run: tools/ci_euler.sh
